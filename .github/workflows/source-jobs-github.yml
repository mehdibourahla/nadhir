name: Source jobs (manual fallback)

# Automatic GitHub Actions triggers (repository_dispatch and schedule — previously
# 720 runs/day for ita_facebook) are retired. The standalone always-on EU backend
# worker (worker/) now consumes ita_facebook, ita_website, dgpc_telegram, local_fwi,
# and effis directly from Postgres source_jobs.
# This workflow remains strictly as a manual emergency fallback via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      contract:
        description: Source contract key (local_fwi, effis, ita_facebook, ita_website, dgpc_telegram)
        required: true
        type: string
      target:
        description: Queue execution target to drain manually
        required: false
        default: worker
        type: choice
        options:
          - worker
          - github

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      contracts: ${{ steps.pick.outputs.contracts }}
      target: ${{ steps.pick.outputs.target }}
    steps:
      - id: pick
        env:
          MANUAL: ${{ inputs.contract }}
          TARGET: ${{ inputs.target || 'worker' }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "contracts=$(jq -nc --arg c "$MANUAL" '[$c]')" >> "$GITHUB_OUTPUT"
          else
            echo 'contracts=["local_fwi","effis","ita_facebook","ita_website","dgpc_telegram"]' >> "$GITHUB_OUTPUT"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

  consume:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.plan.outputs.contracts) }}
    concurrency:
      group: daily-source-${{ matrix.contract }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Consume ${{ matrix.contract }} job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTRACT: ${{ matrix.contract }}
          TARGET: ${{ needs.plan.outputs.target }}
          # model calls go to the home gateway (gpt-6-luna on the ChatGPT plan), behind Cloudflare Access
          NADHIR_GATEWAY_URL: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.NADHIR_GATEWAY_URL || '' }}
          NADHIR_GATEWAY_ACCESS_CLIENT_ID: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.NADHIR_GATEWAY_ACCESS_CLIENT_ID || '' }}
          NADHIR_GATEWAY_ACCESS_CLIENT_SECRET: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.NADHIR_GATEWAY_ACCESS_CLIENT_SECRET || '' }}
          # optional automatic EU/cloud LLM API fallback when the home gateway is unavailable
          LLM_FALLBACK_PROVIDER: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_PROVIDER || '' }}
          LLM_FALLBACK_API_URL: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_API_URL || '' }}
          LLM_FALLBACK_API_KEY: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_API_KEY || '' }}
          LLM_FALLBACK_MODEL: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_MODEL || '' }}
          LLM_FALLBACK_CHAIN: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_CHAIN || '' }}
          LLM_FALLBACK_HEADERS: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_HEADERS || '' }}
          LLM_FALLBACK_TIMEOUT_MS: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_TIMEOUT_MS || '' }}
          LLM_FALLBACK_MAX_RETRIES: ${{ (matrix.contract == 'ita_website' || matrix.contract == 'dgpc_telegram') && secrets.LLM_FALLBACK_MAX_RETRIES || '' }}
        run: |
          deadline=$((SECONDS + 1740))
          while true; do
            set +e
            bun run source:job -- --target "$TARGET" --contract "$CONTRACT"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::source job drain window exceeded"
              exit 1
            fi
            if [ "$status" -eq 76 ]; then continue; fi
            if [ "$status" -ne 75 ]; then exit "$status"; fi
            # Facebook walls by IP: the retry is the next 2-minute slot on a fresh runner, not this one
            if [ "$CONTRACT" = "ita_facebook" ]; then exit 0; fi
            sleep 60
          done
