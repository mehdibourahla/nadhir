name: CI

on:
  pull_request:
  push:
    branches: [main]

# nothing here writes to the repo
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run lint
      # the Android/iOS bundle: a server-only import leaking into the SPA fails here
      - run: cp .env.example .env.local
      - run: bun run build:native
      - run: grep -rq "kuukthyenirwgdfkltlm" dist/client/assets

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.116.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # applies every migration to a fresh Postgres, then runs supabase/tests/*.sql
      - run: supabase start -x studio,imgproxy,inbucket,mailpit,logflare,vector,realtime,edge-runtime,supavisor
        env:
          # setup-cli pins ghcr.io, which throttles shared runners (toomanyrequests); same images on ECR
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      - run: bash scripts/test-db.sh
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      - run: bun install --frozen-lockfile
      - name: Auth integration
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" bun run scripts/test-auth-integration.ts
      - run: bun run scripts/test-ita-retry-concurrency.ts
      - run: bun run scripts/test-civil-publication-concurrency.ts
        env:
          DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: bun run scripts/test-delivery-concurrency.ts
        env:
          DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: bun run scripts/test-webhook-concurrency.ts
        env:
          DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: bun run scripts/test-alert-push-concurrency.ts
        env:
          DELIVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  deploy:
    # Deploys are gated by the "production" environment: its secrets and any
    # required reviewers live there, so deploy rights are a GitHub permission.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, db-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://nadhir.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Schema before code: new code must never meet the old schema. The window
      # where old code meets new schema requires additive migrations (CONTRIBUTING).
      - run: bunx supabase@2.116.0 link --project-ref kuukthyenirwgdfkltlm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: bunx supabase@2.116.0 db push -p "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # VITE_* values bake into the client at build time and CI has no .env.local;
      # the example ships the real public values, so it IS the build config here.
      - run: cp .env.example .env.local
      - run: bun run build
      # A client built without Supabase config throws on every navigation.
      - run: grep -q "kuukthyenirwgdfkltlm" .output/public/assets/client-*.js
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
