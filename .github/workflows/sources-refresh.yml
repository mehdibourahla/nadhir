name: sources-refresh

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # the only workflow here that writes to the repo, and only to open a PR
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - name: Restore FIRMS archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/firms-archive
          key: firms-archive-v1
      - name: Rebuild registry
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bun run build:sources
      # a registry that breaches either bound must never reach review
      - name: Evaluate before proposing
        run: bun run evaluate:sources
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sources-refresh
          title: "Monthly persistent-source registry refresh"
          body: |
            Regenerated from the FIRMS archive.

            Review the cell diff before merging — this changes what Nadhir suppresses.
            The held-out confusion matrix in the job log must show real-event loss
            within bounds and false-event removal above the floor.
          commit-message: "Refresh persistent-source registry"
          add-paths: data/flares/algeria-persistent-sources.json
