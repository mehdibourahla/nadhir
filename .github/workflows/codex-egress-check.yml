name: Codex egress check

# One call from a GitHub runner through the login route to chatgpt.com: proves egress, secrets and login
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run scripts/codex-egress-check.ts
        env:
          NADHIR_APP_URL: https://nadhir.app
          NADHIR_CRON_SECRET: ${{ secrets.NADHIR_CRON_SECRET }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
