name: screening-gate

# Its own workflow rather than a step in CI: the evaluation fetches from FIRMS, so
# a FIRMS outage must not be able to block an unrelated deploy. Paths-filtered so
# only changes that can move the error rates pay the cost.
on:
  pull_request:
    paths:
      - "src/lib/persistent.ts"
      - "src/lib/ingest/persistent.server.ts"
      - "scripts/build-persistent-sources.ts"
      - "scripts/evaluate-persistent-sources.ts"
      - ".github/workflows/screening-gate.yml"
      - "data/flares/**"

permissions: {}

concurrency:
  group: screening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confusion-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Fork pull requests receive no secrets, so the gate reports "not evaluated"
      # rather than failing a contributor for something they cannot supply.
      - id: key
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: echo "present=${{ secrets.FIRMS_MAP_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.key.outputs.present != 'true'
        run: |
          echo "::warning::FIRMS_MAP_KEY unavailable — the held-out confusion matrix was not evaluated."
          echo "Screening thresholds are UNVERIFIED for this run. A maintainer must re-run with the secret before merging a threshold change."

      - if: steps.key.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/firms-archive
          key: firms-archive-v1

      # Cold cache pulls ~733 windows paced at 2s; the pacing is deliberate because
      # FIRMS meters transactions per key and the deployed ingest shares this one.
      - if: steps.key.outputs.present == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.116.0

      - if: steps.key.outputs.present == 'true'
        name: Start isolated source archive
        run: supabase start -x studio,imgproxy,inbucket,mailpit,logflare,vector,realtime,edge-runtime,supavisor
        env:
          # setup-cli pins ghcr.io, which throttles shared runners (toomanyrequests); same images on ECR
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws

      - if: steps.key.outputs.present == 'true'
        name: Rebuild the registry from the labelled archive
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          archive_config="$(supabase status -o json)"
          export SUPABASE_URL="$(jq -r '.API_URL' <<< "$archive_config")"
          export SUPABASE_SERVICE_ROLE_KEY="$(jq -r '.SERVICE_ROLE_KEY' <<< "$archive_config")"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          bun run build:sources

      # Fails the check if real-event loss or false-event removal breach their bounds.
      - if: steps.key.outputs.present == 'true'
        name: Held-out confusion matrix
        run: bun run evaluate:sources
