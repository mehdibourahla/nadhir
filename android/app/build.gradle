apply plugin: 'com.android.application'

def maxPlayVersionCode = 2100000000
def envVersionCode = System.getenv("NADHIR_ANDROID_VERSION_CODE")?.toString()?.trim() ?: ""
def propVersionCode = findProperty("nadhirVersionCode")?.toString()?.trim() ?: ""
def rawVersionCode = envVersionCode ?: propVersionCode ?: "4"
def resolvedVersionCode
try {
    resolvedVersionCode = Integer.parseInt(rawVersionCode)
} catch (NumberFormatException ignored) {
    throw new GradleException("Invalid Android versionCode '${rawVersionCode}': must be an integer in 1..${maxPlayVersionCode}.")
}
if (resolvedVersionCode < 1 || resolvedVersionCode > maxPlayVersionCode) {
    throw new GradleException("Invalid Android versionCode '${resolvedVersionCode}': must be in 1..${maxPlayVersionCode}.")
}

def envVersionName = System.getenv("NADHIR_ANDROID_VERSION_NAME")?.toString()?.trim() ?: ""
def propVersionName = findProperty("nadhirVersionName")?.toString()?.trim() ?: ""
def resolvedVersionName = envVersionName ?: propVersionName ?: "1.1.0"
if (!resolvedVersionName) {
    throw new GradleException("Android versionName must be non-empty.")
}

def uploadStore = System.getenv("NADHIR_UPLOAD_STORE")?.toString()?.trim() ?: ""
def uploadStorePassword = System.getenv("NADHIR_UPLOAD_PASSWORD")?.toString() ?: ""
def hasUploadStorePassword = !uploadStorePassword.trim().isEmpty()
def uploadKeyAlias = System.getenv("NADHIR_UPLOAD_KEY_ALIAS")?.toString()?.trim() ?: "upload"
def uploadKeyPasswordRaw = System.getenv("NADHIR_UPLOAD_KEY_PASSWORD")?.toString() ?: ""
def uploadKeyPassword = uploadKeyPasswordRaw.trim() ? uploadKeyPasswordRaw : uploadStorePassword
def hasReleaseSigningEnv = !uploadStore.isEmpty() && hasUploadStorePassword

android {
    namespace = "app.nadhir"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.nadhir"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningEnv) {
                storeFile file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigningEnv) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def releasePackagingTasks = [
    'assembleRelease',
    'bundleRelease',
    'packageRelease',
    'packageReleaseBundle',
    'signReleaseBundle',
] as Set

gradle.taskGraph.whenReady { taskGraph ->
    def packagingRelease = taskGraph.allTasks.any { task ->
        task.project == project && releasePackagingTasks.contains(task.name)
    }
    if (packagingRelease) {
        if (!uploadStore) {
            throw new GradleException("NADHIR_UPLOAD_STORE must be set for release packaging (assembleRelease / bundleRelease).")
        }
        if (!file(uploadStore).isFile()) {
            throw new GradleException("NADHIR_UPLOAD_STORE file does not exist: ${uploadStore}")
        }
        if (!hasUploadStorePassword) {
            throw new GradleException("NADHIR_UPLOAD_PASSWORD must be set for release packaging (assembleRelease / bundleRelease).")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
